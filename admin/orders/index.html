<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f8fb">
  <title>Orders Dashboard — Maul Digital</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem("maulAdminTheme");
      document.documentElement.dataset.theme =
        saved === "dark" ? "dark" : "light";
    })();
  </script>
  <style>
    :root{
      color-scheme:light;
      --bg:#f6f8fb;
      --panel:#fff;
      --panel-2:#f8fafc;
      --text:#111827;
      --muted:#667085;
      --line:#e4e7ec;
      --accent:#ff3158;
      --green:#15803d;
      --amber:#b45309;
      --red:#b42318;
      --blue:#175cd3;
      --shadow:0 16px 44px rgba(15,23,42,.07);
      --nav:rgba(255,255,255,.9);
    }
    html[data-theme="dark"]{
      color-scheme:dark;
      --bg:#07111f;
      --panel:#0c1828;
      --panel-2:#101f33;
      --text:#edf3fb;
      --muted:#9cabbd;
      --line:rgba(148,163,184,.18);
      --shadow:0 16px 44px rgba(0,0,0,.26);
      --nav:rgba(7,17,31,.9);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    button,input,select{font:inherit}
    .shell{width:min(1440px,calc(100% - 36px));margin:auto}
    .topbar{
      position:sticky;top:0;z-index:50;
      border-bottom:1px solid var(--line);
      background:var(--nav);
      backdrop-filter:blur(18px);
    }
    .topbar-inner{
      min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px
    }
    .brand{font-size:25px;font-weight:800;letter-spacing:-.05em}
    .brand b{color:var(--accent)}
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .btn{
      border:1px solid var(--line);background:var(--panel);color:var(--text);
      border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:13px;
      text-decoration:none
    }
    .btn:hover{border-color:#b8c0cc}
    .page{padding:38px 0 60px}
    .heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
    .eyebrow{
      font:600 11px/1.2 "JetBrains Mono",monospace;
      color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px
    }
    h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.055em;margin:0 0 10px}
    .lead{color:var(--muted);margin:0;line-height:1.65}
    .summary{
      display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px
    }
    .card{
      border:1px solid var(--line);background:var(--panel);border-radius:14px;
      box-shadow:var(--shadow)
    }
    .metric{padding:18px}
    .metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
    .metric strong{font-size:24px;letter-spacing:-.03em}
    .toolbar{
      display:flex;align-items:center;gap:10px;padding:13px;margin-bottom:14px;flex-wrap:wrap
    }
    .search{flex:1 1 320px;min-width:220px}
    input,select{
      width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
      color:var(--text);min-height:42px;padding:9px 11px;outline:none
    }
    input:focus,select:focus{border-color:rgba(255,49,88,.6);box-shadow:0 0 0 3px rgba(255,49,88,.08)}
    .filter{width:160px}
    .table-card{overflow:hidden}
    .table-scroll{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:1220px}
    th{
      position:sticky;top:0;background:var(--panel-2);z-index:1;
      text-align:left;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
      padding:12px 14px;border-bottom:1px solid var(--line)
    }
    td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
    tr:last-child td{border-bottom:0}
    .customer strong{display:block;margin-bottom:4px}
    .sub{color:var(--muted);font-size:12px;line-height:1.55}
    .mono{font-family:"JetBrains Mono",monospace;font-size:11px}
    .amount{font-weight:700;white-space:nowrap}
    .badge{
      display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;
      font-size:11px;font-weight:800;letter-spacing:.03em
    }
    .SUCCESS{background:rgba(22,163,74,.10);color:var(--green)}
    .PENDING{background:rgba(245,158,11,.11);color:var(--amber)}
    .EXPIRED,.FAILED{background:rgba(239,68,68,.09);color:var(--red)}
    .empty,.error{padding:36px;text-align:center;color:var(--muted)}
    .error{color:var(--red)}
    .footer-row{
      display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 15px;
      color:var(--muted);font-size:12px;border-top:1px solid var(--line)
    }
    .admin-email{font-family:"JetBrains Mono",monospace}
    @media(max-width:1000px){
      .summary{grid-template-columns:repeat(2,1fr)}
      .summary .metric:last-child{grid-column:1/-1}
    }
    @media(max-width:650px){
      .shell{width:min(100% - 24px,1440px)}
      .heading{align-items:flex-start;flex-direction:column}
      .summary{grid-template-columns:1fr 1fr}
      .toolbar{align-items:stretch}
      .filter{width:100%}
      .topbar-inner{align-items:flex-start;padding:11px 0}
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <div class="brand">M<b>.</b> Admin</div>
    <div class="top-actions">
      <button class="btn" id="theme-button" type="button">Dark mode</button>
      <button class="btn" id="refresh-button" type="button">Refresh</button>
      <button class="btn" id="export-button" type="button">Export CSV</button>
      <a class="btn" href="/cdn-cgi/access/logout">Logout</a>
    </div>
  </div>
</header>

<main class="page shell">
  <div class="heading">
    <div>
      <div class="eyebrow">Private / Cloudflare Access</div>
      <h1>Orders Dashboard</h1>
      <p class="lead">Data checkout dan pembayaran yang tersimpan di Cloudflare D1.</p>
    </div>
  </div>

  <section class="summary">
    <div class="card metric"><span>Total order</span><strong id="metric-total">—</strong></div>
    <div class="card metric"><span>SUCCESS</span><strong id="metric-success">—</strong></div>
    <div class="card metric"><span>PENDING</span><strong id="metric-pending">—</strong></div>
    <div class="card metric"><span>EXPIRED</span><strong id="metric-expired">—</strong></div>
    <div class="card metric"><span>Successful value</span><strong id="metric-value">—</strong></div>
  </section>

  <section class="card toolbar">
    <div class="search">
      <input id="search-input" type="search" placeholder="Cari nama, email, phone, invoice, atau produk…">
    </div>
    <div class="filter">
      <select id="status-filter">
        <option value="ALL">All status</option>
        <option value="SUCCESS">SUCCESS</option>
        <option value="PENDING">PENDING</option>
        <option value="EXPIRED">EXPIRED</option>
        <option value="FAILED">FAILED</option>
      </select>
    </div>
  </section>

  <section class="card table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Product</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Payment</th>
            <th>Created</th>
            <th>Paid</th>
            <th>Email</th>
            <th>Invoice</th>
          </tr>
        </thead>
        <tbody id="orders-body">
          <tr><td colspan="9" class="empty">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="footer-row">
      <span id="result-count">—</span>
      <span class="admin-email" id="admin-email"></span>
    </div>
  </section>
</main>

<script>
(function () {
  const themeButton = document.getElementById("theme-button");
  const refreshButton = document.getElementById("refresh-button");
  const exportButton = document.getElementById("export-button");
  const searchInput = document.getElementById("search-input");
  const statusFilter = document.getElementById("status-filter");
  const body = document.getElementById("orders-body");

  let lastOrders = [];
  let debounceTimer = null;

  function setTheme(theme) {
    const next = theme === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("maulAdminTheme", next);
    themeButton.textContent = next === "dark" ? "Light mode" : "Dark mode";
  }

  setTheme(document.documentElement.dataset.theme);

  themeButton.addEventListener("click", () => {
    setTheme(
      document.documentElement.dataset.theme === "dark"
        ? "light"
        : "dark"
    );
  });

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatIdr(value) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }).format(Number(value || 0));
  }

  function formatDate(value) {
    if (!value) return "—";
    const date = new Date(
      String(value).includes("T")
        ? value
        : String(value).replace(" ", "T") + "Z"
    );

    if (Number.isNaN(date.getTime())) return value;

    return new Intl.DateTimeFormat("id-ID", {
      dateStyle: "medium",
      timeStyle: "short",
      timeZone: "Asia/Jakarta"
    }).format(date);
  }

  function paymentName(order) {
    if (order.payment_channel) {
      return String(order.payment_channel)
        .replace(/^VIRTUAL_ACCOUNT_/, "VA ")
        .replace(/_/g, " ");
    }
    return "—";
  }

  function renderOrders(orders) {
    lastOrders = orders;

    if (!orders.length) {
      body.innerHTML =
        '<tr><td colspan="9" class="empty">Tidak ada order untuk filter ini.</td></tr>';
      return;
    }

    body.innerHTML = orders.map((order) => {
      const customer = order.customer_name || "—";
      const email = order.customer_email || "—";
      const phone = order.customer_phone || "—";
      const status = String(order.status || "").toUpperCase();

      return `
        <tr>
          <td class="customer">
            <strong>${escapeHtml(customer)}</strong>
            <div class="sub">${escapeHtml(email)}</div>
            <div class="sub">${escapeHtml(phone)}</div>
          </td>
          <td>
            <strong>${escapeHtml(order.product_name || "—")}</strong>
            <div class="sub mono">${escapeHtml(order.product_id || "")}</div>
          </td>
          <td class="amount">${escapeHtml(formatIdr(order.amount))}</td>
          <td><span class="badge ${escapeHtml(status)}">${escapeHtml(status || "—")}</span></td>
          <td>
            <div>${escapeHtml(paymentName(order))}</div>
            <div class="sub">${escapeHtml(order.acquirer || "")}</div>
          </td>
          <td>${escapeHtml(formatDate(order.created_at))}</td>
          <td>${escapeHtml(formatDate(order.paid_at))}</td>
          <td>
            <div>${escapeHtml(order.email_status || "—")}</div>
            <div class="sub">${escapeHtml(formatDate(order.email_sent_at))}</div>
          </td>
          <td class="mono">${escapeHtml(order.invoice_number || "—")}</td>
        </tr>`;
    }).join("");
  }

  function renderSummary(summary) {
    document.getElementById("metric-total").textContent =
      Number(summary.total_orders || 0).toLocaleString("id-ID");
    document.getElementById("metric-success").textContent =
      Number(summary.success_orders || 0).toLocaleString("id-ID");
    document.getElementById("metric-pending").textContent =
      Number(summary.pending_orders || 0).toLocaleString("id-ID");
    document.getElementById("metric-expired").textContent =
      Number(summary.expired_orders || 0).toLocaleString("id-ID");
    document.getElementById("metric-value").textContent =
      formatIdr(summary.success_value || 0);
  }

  async function loadOrders() {
    body.innerHTML =
      '<tr><td colspan="9" class="empty">Loading orders…</td></tr>';

    const params = new URLSearchParams({
      status: statusFilter.value,
      q: searchInput.value.trim(),
      limit: "200"
    });

    try {
      const response = await fetch(
        "/admin/api/orders?" + params.toString(),
        {
          credentials: "same-origin",
          cache: "no-store"
        }
      );

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.error || "Dashboard data gagal dimuat");
      }

      renderSummary(data.summary || {});
      renderOrders(data.orders || []);

      document.getElementById("result-count").textContent =
        `${Number(data.total || 0).toLocaleString("id-ID")} order`;
      document.getElementById("admin-email").textContent =
        data.admin_email || "";
    } catch (error) {
      console.error(error);
      body.innerHTML =
        '<tr><td colspan="9" class="error">Dashboard tidak dapat memuat data. Pastikan Cloudflare Access dan environment variables sudah benar.</td></tr>';
    }
  }

  function csvEscape(value) {
    const text = String(value ?? "");
    return `"${text.replace(/"/g, '""')}"`;
  }

  function exportCsv() {
    if (!lastOrders.length) return;

    const headers = [
      "invoice_number",
      "customer_name",
      "customer_email",
      "customer_phone",
      "product_name",
      "amount",
      "currency",
      "status",
      "payment_channel",
      "acquirer",
      "created_at",
      "expires_at",
      "paid_at",
      "email_status",
      "email_sent_at"
    ];

    const rows = [
      headers.map(csvEscape).join(","),
      ...lastOrders.map((order) =>
        headers.map((key) => csvEscape(order[key])).join(",")
      )
    ];

    const blob = new Blob(
      ["\uFEFF" + rows.join("\n")],
      { type: "text/csv;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `maul-orders-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  refreshButton.addEventListener("click", loadOrders);
  exportButton.addEventListener("click", exportCsv);
  statusFilter.addEventListener("change", loadOrders);
  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadOrders, 350);
  });

  loadOrders();
})();
</script>
</body>
</html>
